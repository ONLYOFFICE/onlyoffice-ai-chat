services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: samples/headless-nextjs/Dockerfile
      target: deps
    command: ["npx", "prisma", "db", "push"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_chat?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: samples/headless-nextjs/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_chat?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
